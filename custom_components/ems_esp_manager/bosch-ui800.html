<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bosch HMI 800 – Home Assistant</title>
<!--
  Bosch HMI 800 / UI 800 – Nachbau der Bedieneinheit für Home Assistant
  Optik und Menüführung nach dem Bosch-Online-Simulator (bosch-homecomfort.com/hmi800, CS5800i AW)
  Servicemenü: ≡ auf der Startseite 2 Sekunden gedrückt halten
  Datenquelle: EMS-ESP (BBQKees) über MQTT-Discovery, Standard-Entitätsnamen
  (boiler_* = Wärmepumpe, thermostat_* = UI 800 / BC400)

  Installation (empfohlen): im EMS-ESP Manager (ab v1.6.0) enthalten –
    Sidebar-Eintrag „Bosch HMI 800“, Zuordnung und Token werden in Home Assistant
    gespeichert, neue Versionen im Dashboard „EMS-ESP“ hochladen.

  Installation ohne Manager:
    1. Datei nach /config/www/bosch-ui800.html kopieren
    2. HA: Einstellungen → Dashboards → Dashboard hinzufügen → "Webseite"
       URL: /local/bosch-ui800.html
    → Das Panel nutzt automatisch die Anmeldung von Home Assistant.
    Alternativ direkt im Browser öffnen: http://<ha>:8123/local/bosch-ui800.html
    (dann unten im Script HA_TOKEN eintragen oder im Menü → Verbindung).

  Entitäten anpassen: Menü → Panel-Einstellungen → Entitäten-Zuordnung
  oder unten im Block ENTITY_OVERRIDES fest eintragen.
-->
<style>
/* ===== Bosch HMI 800 Optik (nach bosch-homecomfort.com/hmi800) ===== */
:root{
  --bg:#000; --txt:#fff; --dim:#a7adb3; --dim2:#62686e; --sep:#2c2c2c; --line:#3a3a3a;
  --acc:#1d8fd8; --ok:#5fb34a; --warn:#f2b632; --err:#e2001a; --hl:#3b3b3b;
  --red:#e2001a; --blue:#2a8fd6; --teal:#1e8c80;
  --rainbow:linear-gradient(90deg,#9e1b22 0%,#d5121e 20%,#7b2a83 31%,#3b3a8f 42%,#1f4f9e 54%,#1a86c9 64%,#22a3c4 72%,#139a68 82%,#8fc551 89%,#16893c 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--txt);overflow:hidden;
  font-family:"Bosch Sans","Segoe UI","Roboto","Helvetica Neue",Arial,sans-serif;font-weight:400}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#dev{width:800px;height:480px;position:relative;background:var(--bg);overflow:hidden;transform-origin:center center}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0;z-index:50}
svg{overflow:visible}
/* Kopfzeile mit Bosch-Regenbogenlinie */
.hdr{height:76px;position:relative;margin:0 66px}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rainbow)}
.hdr .l{position:absolute;left:14px;top:14px;display:flex;gap:10px}
.hdr .r{position:absolute;right:14px;top:14px}
.hdr .c{position:absolute;left:50%;top:14px;height:44px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;font-size:22px;white-space:nowrap}
.hdr .ttl{font-size:21px;letter-spacing:.2px;display:flex;align-items:center;gap:10px;max-width:440px;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.ib:active{background:#222}
.ib svg{width:30px;height:30px}
/* Startseite */
.car{position:absolute;top:96px;left:0;right:0;height:300px}
.car .inner{position:absolute;left:66px;right:66px;top:0;bottom:0;overflow:hidden}
.track{display:flex;height:100%;transition:transform .35s ease}
.slot{flex:0 0 334px;height:100%;position:relative;display:flex;flex-direction:column}
.slot + .slot::before{content:"";position:absolute;left:0;top:10px;bottom:16px;width:1px;background:var(--line)}
.tile{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;min-width:0}
.tile:active{background:#151515}
.slot .tile + .tile::before{content:"";position:absolute;top:0;left:24px;right:24px;height:1px;background:var(--line)}
.tile .lbl{font-size:23px;letter-spacing:.2px;text-align:center;line-height:1.25}
.tile .sub{font-size:17px;border-top:1px solid #555;padding-top:6px;margin-top:6px;min-width:120px;text-align:center}
.tile .big{font-size:96px;font-weight:300;line-height:1;display:flex;align-items:flex-start}
.tile .big .d{font-size:44px;display:flex;flex-direction:column;align-items:flex-start;line-height:.9;margin-left:4px}
.tile .top{display:flex;flex-direction:column;align-items:center;font-size:17px;margin-bottom:6px}
.tile .top .m{display:inline-flex;align-items:flex-end;gap:6px;font-size:18px}
.tile svg.ic{width:36px;height:36px}
.homeline{position:absolute;left:66px;right:66px;top:400px;height:1px;background:var(--line)}
.arr{position:absolute;top:110px;width:48px;height:80px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5}
.arr svg{width:24px;height:42px}
.arr.l{left:20px}.arr.r{right:20px}
.dots{position:absolute;top:438px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:#4a4f55}
.dots i.on{background:var(--acc);width:12px;height:12px}

/* ---------- Zuordnung im Dashboard-Register (Bosch-Optik, skaliert mit der Fensterbreite) ---------- */
#mapx{display:none;position:fixed;inset:0;overflow:auto;background:#000;color:#fff;font-size:15px;line-height:1.3}
body.mapx #stage{display:none}
body.mapx #mapx{display:block}
#mapx *{box-sizing:border-box}
#mapx .mx-wrap{max-width:470px;margin:0 auto;padding:0 6px 24px;zoom:var(--mxz,2)}
#mapx .mx-h{position:sticky;top:0;z-index:5;background:#000;height:46px;display:grid;grid-template-columns:30px 1fr 30px;align-items:center}
#mapx .mx-h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rainbow)}
#mapx .mx-h .mx-t{grid-column:2;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapx .mx-back{grid-column:1;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
#mapx .mx-back svg{width:22px;height:22px}
#mapx .mx-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}
#mapx .mx-st{border:1px solid #333;border-radius:6px;padding:7px 4px 6px;text-align:center;cursor:pointer;background:#0b0b0b}
#mapx .mx-st:hover{border-color:#555}
#mapx .mx-st .mx-num{display:block;font-size:20px;line-height:1.1}
#mapx .mx-st .mx-lab{display:block;font-size:10px;color:#9a9a9a;margin-top:2px;white-space:nowrap}
#mapx .mx-st.mx-ok .mx-num{color:#7fd06a}
#mapx .mx-st.mx-miss .mx-num{color:#f08a8a}
#mapx .mx-st.mx-na .mx-num{color:#a0a0a0}
#mapx .mx-st.mx-on{border-color:var(--acc);background:#08233a}
#mapx .mx-st.mx-on .mx-lab{color:#cfe6f7}
#mapx .mx-q{display:block;width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#eee;padding:7px 10px;font:inherit;font-size:13px;margin:0 0 6px;outline:none}
#mapx .mx-q:focus{border-color:var(--acc)}
#mapx .mx-sec{font-size:11px;color:#8b8b8b;margin:10px 6px 2px;text-transform:uppercase;letter-spacing:.04em}
#mapx .mx-r{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px;border-bottom:1px solid var(--sep,#2a2a2a);cursor:pointer}
#mapx .mx-r:hover{background:#0d0d0d}
#mapx .mx-k{flex:1 1 auto;min-width:0}
#mapx .mx-k .mx-l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapx .mx-k small{display:block;font-size:11px;color:#8b8b8b;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapx .mx-k small .mx-via{color:#4fb3f6}
#mapx .mx-v{flex:0 0 auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
#mapx .mx-val{color:#9a9a9a;font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis}
#mapx .mx-v svg{width:9px;height:15px;opacity:.8}
#mapx .mx-p{font-size:11px;padding:1px 8px;border-radius:9px;background:#1e3a1e;color:#9fe29f}
#mapx .mx-p.mx-no{background:#3a1e1e;color:#f0a0a0}
#mapx .mx-p.mx-nv{background:#2a2a2a;color:#a0a0a0}
#mapx .mx-n{font-size:11px;color:#8b8b8b;padding:10px 6px;line-height:1.5}
#mapx .mx-n b{color:#bbb;font-weight:500}
#mapx .mx-n.mx-good{color:#9fe29f}
#mapx .mx-ed{padding:6px}
#mapx .mx-lb{font-size:11px;color:#8b8b8b;margin-top:12px}
#mapx .mx-vl{font-size:15px;margin-top:2px;word-break:break-all}
#mapx .mx-vl.mx-mono{font-size:13px}
#mapx .mx-in{display:block;width:100%;background:#111;border:1px solid #333;border-radius:6px;color:#eee;padding:8px 10px;font:13px ui-monospace,Consolas,monospace;margin-top:4px;outline:none}
#mapx .mx-in:focus{border-color:var(--acc)}
#mapx .mx-sg{font-size:13px;padding:7px 6px;border-bottom:1px solid #222;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#mapx .mx-sg:hover{background:#0d0d0d}
#mapx .mx-sg span:last-child{color:#888}
#mapx .mx-bt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
#mapx .mx-bt div{text-align:center;border:1px solid #555;border-radius:4px;padding:8px 0;cursor:pointer;font-size:14px}
#mapx .mx-bt div:hover{border-color:#888}
#mapx .mx-bt .mx-pri{background:var(--acc);border-color:var(--acc)}
#mapx .mx-c{font-size:10px;padding:1px 5px;border-radius:7px;background:#1e3a1e;color:#9fe29f;font-weight:500}
#mapx .mx-c.mx-bad{background:#3a2a10;color:#f2c46a}
#mapx .mx-c.mx-off{background:#222;color:#777}
#mapx .mx-chk{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #333;border-radius:6px;padding:8px 10px;margin:0 0 8px;background:#0b0b0b}
#mapx .mx-chk small{display:block;font-size:11px;color:#8b8b8b;margin-top:2px}
#mapx .mx-btn{flex:0 0 auto;border:1px solid var(--acc);color:#fff;background:var(--acc);border-radius:4px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
#mapx .mx-btn.mx-ghost{background:none;color:#cfe6f7}
#mapx .mx-btn.mx-dis{opacity:.5;pointer-events:none}
#mapx .mx-stats.mx-s3{grid-template-columns:repeat(3,1fr)}
#mapx .mx-stats.mx-s2{grid-template-columns:repeat(4,1fr);margin-top:0}
#mapx .mx-st.mx-rbad .mx-num,#mapx .mx-st.mx-wbad .mx-num{color:#f2c46a}
#mapx .mx-st.mx-rok .mx-num,#mapx .mx-st.mx-wok .mx-num{color:#7fd06a}
#mapx .mx-tbl{margin-top:4px;border-top:1px solid #222}
#mapx .mx-tbl div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #222;font-size:13px}
#mapx .mx-tbl div span:first-child{color:#8b8b8b}
#mapx .mx-tbl div span:last-child{text-align:right;word-break:break-all}
@media (max-width:700px){#mapx .mx-wrap{zoom:1}#mapx .mx-stats{grid-template-columns:repeat(2,1fr)}}
/* Bildschirme */
.scr{position:absolute;inset:0;background:var(--bg)}
.body{position:absolute;top:80px;left:66px;right:66px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#777 transparent;padding:0 0 12px}
.body::-webkit-scrollbar{width:4px}.body::-webkit-scrollbar-thumb{background:#777;border-radius:2px}
.list{margin:6px 20px 0}
.row{min-height:66px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--sep);font-size:21px;cursor:pointer;gap:14px;line-height:1.25}
.row:active{background:var(--hl)}
.row .v{color:#e8e8e8;display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:20px}
.row .v.d{color:#e8e8e8}
.row .k{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .k small{display:block;font-size:13px;color:var(--dim2);margin-top:2px}
.row.ro{cursor:default}.row.ro:active{background:none}
.row.miss{opacity:.4}
.row.sec{min-height:44px;font-size:15px;color:var(--dim);letter-spacing:.6px;cursor:default;padding-top:16px;border-bottom:1px solid var(--sep)}
.row.sec:active{background:none}
.chev{width:12px;height:20px;opacity:.9}
.tog{width:48px;height:26px;border-radius:13px;position:relative;flex:0 0 auto;background:#5a5f64}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--acc)}.tog.on::after{left:25px}
.rad{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:#5a5f64;position:relative}
.rad.on{background:var(--acc)}.rad.on::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.note{font-size:16px;color:var(--dim);padding:14px 12px;line-height:1.45}
.warnbox{border-left:3px solid var(--warn);color:#f5d999;padding:10px 14px;margin:12px 20px;font-size:16px;line-height:1.4;background:#1a1505}
/* Heizen / Warmwasser – Bosch-Ansicht mit Rolle */
.tabs{position:absolute;top:96px;left:0;right:0;display:flex;justify-content:center;gap:30px;font-size:21px}
.tabs span{cursor:pointer;padding:2px 2px 4px}
.tabs span.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.hroll{position:absolute;top:150px;left:66px;right:66px;height:170px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hroll .it{position:absolute;display:flex;align-items:flex-start;font-weight:300;transition:all .25s;cursor:pointer;white-space:nowrap}
.hroll .it sup{font-size:.42em;margin-top:.04em;margin-left:2px}
.hroll .navl,.hroll .navr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:70px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hroll .navl{left:0}.hroll .navr{right:0}
.hroll .navl.off{opacity:.25}.hroll .navr.off{opacity:.25}
.stline{position:absolute;top:340px;left:66px;right:66px;text-align:center;font-size:20px;cursor:pointer;color:#e8e8e8}
.bline{position:absolute;left:66px;right:66px;top:400px;height:1px;background:var(--line)}
.bar{position:absolute;left:66px;right:66px;top:404px;height:70px;display:flex;align-items:center;justify-content:space-between;font-size:21px;padding:0 20px}
.bar span{cursor:pointer;display:flex;align-items:center;gap:8px}
.bar .info{cursor:default;gap:14px;color:#eee}
/* Werteingabe (Rolle) */
.vroll{position:absolute;top:96px;left:0;right:0;height:250px;display:flex;align-items:center;justify-content:center}
.vroll .col{position:relative;width:420px;height:250px;overflow:hidden;cursor:ns-resize;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
.vroll .v{position:absolute;left:0;right:0;text-align:center;font-weight:300;line-height:1;white-space:nowrap}
.vroll .v.c{top:75px;font-size:100px}
.vroll .v.p{top:-20px;font-size:80px;opacity:.55}
.vroll .v.n{top:190px;font-size:80px;opacity:.55}
.vroll .ud{position:absolute;left:calc(50% + 150px);top:72px;display:flex;flex-direction:column;gap:46px}
.vroll .ud div{width:44px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vroll .unit{font-size:15px;color:var(--dim);position:absolute;bottom:-4px;left:0;right:0;text-align:center}
.edhint{position:absolute;left:66px;right:66px;top:400px;border-top:1px solid var(--line);padding:16px 20px;font-size:15px;color:var(--dim);display:flex;justify-content:space-between}
/* Übersicht Kältekreislauf (Service → Diagnose) */
.rk{position:absolute;top:84px;left:66px;right:66px;height:312px;display:flex;align-items:center;justify-content:center}
.rk svg{width:100%;height:100%}
.rtabs{justify-content:center!important;gap:46px}
.rtabs span{padding:2px 2px 4px}
.rtabs span.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.portrait .rk{top:calc(76px + var(--st));left:4px;right:4px;bottom:calc(80px + var(--sb));height:auto}
/* Systemübersicht */
.so{position:absolute;top:96px;left:66px;right:66px;height:300px}
.so .info{position:absolute;left:20px;top:10px;font-size:19px;color:#eee}
.so .info .k{font-size:18px;margin-top:20px}
.so .info .v{display:flex;align-items:center;gap:10px;font-size:23px;margin-top:6px;cursor:pointer;width:200px}
.so .info .v .chev{margin-left:auto}
.so .info .icons{display:flex;gap:16px;margin-top:8px;color:#ddd}
.so svg.sch{position:absolute;left:220px;top:0}
.bar .aux{opacity:.35}.bar .aux.on{opacity:1}
/* Energie */
.etabs{position:absolute;top:92px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-size:19px}
.etabs span{cursor:pointer;padding-bottom:3px}.etabs span.on{color:var(--acc);border-bottom:2px solid var(--acc)}
.en{position:absolute;top:130px;left:96px;right:96px;display:flex;align-items:center;gap:44px;height:260px}
.leg div{display:flex;align-items:center;gap:14px;font-size:21px;margin:9px 0;width:330px}
.leg i{width:14px;height:14px;border-radius:50%}
.leg b{font-weight:400;margin-left:auto;color:#ddd;font-size:18px}
/* Außentemperatur-Grafik */
.chart{position:absolute;top:92px;left:66px;right:66px;height:300px}
/* Overlays / Popups */
#ovl{position:absolute;inset:0;z-index:40;display:none}
.pop{position:absolute;left:90px;right:90px;top:40px;min-height:260px;background:#000;border:1px solid #555;padding:28px 34px;font-size:19px;line-height:1.5}
.pop .x{position:absolute;right:0;top:0;width:52px;height:52px;border-left:1px solid #555;border-bottom:1px solid #555;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:30px;font-weight:300}
.pop h3{margin:0 0 14px;font-weight:400;font-size:22px;display:flex;gap:12px;align-items:center}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:#1e1e1e;border:1px solid #444;padding:10px 20px;font-size:17px;z-index:60;display:none;max-width:700px;text-align:center}
.saver{position:absolute;inset:0;background:#000;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#666}
.saver .clk{font-size:90px;font-weight:300;color:#444}
.kbd textarea,.kbd input{width:100%;background:#111;border:1px solid #444;color:#fff;font:inherit;font-size:16px;padding:10px;user-select:text}
.kbd input{height:46px}
.sbar{position:relative;height:16px;flex:1;background:#2a2a2a;margin:0 10px 0 4px;min-width:120px}
.sbar i{position:absolute;top:0;bottom:0;background:var(--acc)}
.sbar b{position:absolute;top:18px;font-size:11px;color:#888;font-weight:400;transform:translateX(-50%)}
.sday{width:42px;flex:none}
.tbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:40px;border:1px solid #666;font-size:22px;cursor:pointer}
.pill{font-size:13px;padding:2px 8px;border-radius:10px;background:#1e3a1e;color:#9fe29f}
.pill.no{background:#3a1e1e;color:#f0a0a0}.pill.na{background:#2a2a2a;color:#9a9a9a}.pill.dm{background:#3a3000;color:#ffd866}
.btns{position:absolute;bottom:16px;left:86px;right:86px;display:flex;gap:20px}
.btn{flex:1;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid #888}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn:active{filter:brightness(1.25)}
.abs{position:absolute;top:110px;left:66px;right:66px;display:flex}
.abs .tile{height:240px}
.abs .tile + .tile{border-left:1px solid var(--line)}
.abs .tile.sel .lbl{color:var(--acc)}

/* ===== Hochformat / iPhone 17 (402 × 874 pt) ===== */
body.portrait #dev{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
.portrait .hdr{margin:0 12px;height:calc(64px + var(--st))}

<div id="mapx"></div>
<div id="stage"><div id="dev">

<script>
/* =====================================================================
   1) KONFIGURATION
   ===================================================================== */
// ── Home-Assistant-Zugang ─────────────────────────────────────────────
// HA_TOKEN: Long-Lived Access Token (HA → Profil → Sicherheit → Token erstellen).
//   Leer lassen = Anmeldung von HA mitbenutzen (nur als Webseiten-Dashboard unter /local/…).
//   Eingetragen = direkter WebSocket, funktioniert auch außerhalb von HA (Tablet, Browser).
// HA_URL:   leer = gleiche Adresse wie die Seite, sonst z.B. "http://192.168.1.10:8123"
// Achtung: Wer die Datei unter /local/ abrufen kann, sieht den Token (kein Login nötig).
const HA_TOKEN = "";
const HA_URL   = "";
// Feste Umbenennungen: Standard-Entität → deine Entität (optional).
// Beispiel: "sensor.boiler_curflowtemp": "sensor.ems_esp_boiler_curflowtemp"
const ENTITY_OVERRIDES = {
};
const INSTALLER = (window.EMS_ESP_MANAGER && window.EMS_ESP_MANAGER.installer) || { name:"", addr:"", tel:"" };   // im Manager unter „Konfigurieren“
const HEATING_CIRCUITS = [1,2,3,4];  // werden nur angezeigt, wenn thermostat_hcX_* existiert
const SERVICE_PIN = "";               // leer = Servicemenü ohne PIN, z.B. "1234"
const PANEL_VERSION = "2026.11.22";   // bei jeder neuen Version erhöhen (Upload im EMS-ESP Manager)

// Vom EMS-ESP Manager beim Ausliefern gesetzt (nicht von Hand eintragen)
const MGR = window.EMS_ESP_MANAGER || null;
const MGR_PAGE = MGR && MGR.page || '';

/* =====================================================================
   2) HILFSFUNKTIONEN / SPEICHER
   ===================================================================== */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('ui800.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('ui800.'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = (v,dec) => { if(v==null||isNaN(v)) return '–'; const d = dec!=null?dec:(Math.abs(v%1)>0.001?1:0); return Number(v).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); };
const min2t = m => { m=Math.round(+m); if(isNaN(m)) return '–'; const h=Math.floor(m/60)%24, mm=m%60; return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'); };
const min2h = m => { m=+m; if(isNaN(m)) return '–'; return fmtN(Math.round(m/60),0)+' h'; };
function toast(t,ms){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>el.style.display='none',ms||2600); }

let settings = Object.assign({ showCooling:true, advanced:false, brightness:100, saver:0, lock:false, mode:'auto', url:'', token:'', showMissing:false }, LS.get('settings',{}));
function saveSettings(){ LS.set('settings',settings); applyDisplay(); }
let userMap = Object.assign({}, ENTITY_OVERRIDES, LS.get('map',{}));
let emsIds = null;               // vom Manager: Werte, die EMS-ESP überhaupt liefert (Kurznamen), null = unbekannt
let emsDevices = null;           // vom Manager: erkannte EMS-Geräte (Anlagenprofil)
let haEms = null;
let haEmsOff = [];
let createdIds = new Set();      // vom Manager selbst angelegte Entitäten (Standard-IDs)               // vom Manager: EMS-ESP-Entitäten, die in HA deaktiviert sind                // vom Manager: alle EMS-ESP-Entitäten in HA
let autoMap = {};                // vom Manager: Standard-ID → echte ID (andere Entity-ID-Formate, englische Langnamen …)
// Zuordnung / Heizkreisnamen: mit Manager in Home Assistant, sonst im Browser
function mgrSave(data){
  if(!MGR || !conn.ready || !conn.msg) return Promise.resolve(false);
  return conn.msg(Object.assign({type:'ems_esp_manager/panel/save'}, data)).then(()=>true)
    .catch(e=>{ toast('Nicht in HA gespeichert: '+((e&&e.message)||e)); return false; });
}
function saveMap(m){ LS.set('map', m); for(const k in resolved) delete resolved[k]; return mgrSave({map:m}); }
async function loadMgr(){
  if(!MGR || !conn.msg) return;
  try{
    const r = await conn.msg({type:'ems_esp_manager/panel/get'});
    // einmalige Übernahme: bisher nur im Browser gespeicherte Zuordnung/Namen nach HA
    const localMap = LS.get('map',{}), localHc = settings.hcNames||{};
    if(r.is_admin && !Object.keys(r.map||{}).length && Object.keys(localMap).length){ r.map = localMap; await mgrSave({map:localMap}); }
    if(r.is_admin && !Object.keys(r.hc_names||{}).length && Object.keys(localHc).length){ r.hc_names = localHc; await mgrSave({hc_names:localHc}); }
    userMap = Object.assign({}, ENTITY_OVERRIDES, r.map||{});
    autoMap = r.auto || {};
    emsIds = Array.isArray(r.ems_ids) ? new Set(r.ems_ids) : null;
    emsDevices = Array.isArray(r.devices) ? r.devices : null;
    haEms = Array.isArray(r.ha_ems) && r.ha_ems.length ? new Set(r.ha_ems) : null;
    haEmsOff = Array.isArray(r.ha_ems_off) ? r.ha_ems_off : [];
    createdIds = new Set(Array.isArray(r.created) ? r.created : []);
    if(r.dhw_opt) DOPT = r.dhw_opt;
    if(typeof r.show_cooling==='boolean') settings.showCooling = r.show_cooling;
    HEATING_CIRCUITS.filter(hcExists).forEach(n=>{ if(n===1 && !SCHED[n]) loadSched(n,false); });   // für „Aktuelles Niveau“
    if(r.check && r.check.entities && !MX.chk){ MX.chk = r.check.entities; MX.chkAt = r.check.t ? new Date(r.check.t*1000) : new Date(); }
    LS.set('map', r.map||{});
    settings.hcNames = Object.assign({}, r.hc_names||{}); LS.set('settings',settings);
    MGR.is_admin = !!r.is_admin;
    for(const k in resolved) delete resolved[k];
    scheduleRender();
  }catch(e){ toast('Zuordnung aus HA nicht geladen: '+((e&&e.message)||e)); }
}

/* =====================================================================
   3) SELECT-OPTIONEN (EMS-ESP Enum-Reihenfolge → deutsche Anzeige)
      EMS-ESP liefert je nach Spracheinstellung englische oder deutsche
      Optionen. Zuordnung erfolgt über die Position (Index).
   ===================================================================== */
const ENUM = {
  'hc.mode':        [['off','Aus'],['manual','Manuell'],['auto','Auto']],
  'hc.hpoperatingmode':[['off','Aus (kein Heizen/Kühlen)'],['auto','Auto'],['heating','Nur Heizen'],['cooling','Nur Kühlen']],
  'hc.summersetmode':[['summer','Sommer'],['auto','Auto'],['winter','Winter']],
  'hc.heatingtype': [['off','Aus'],['radiator','Heizkörper'],['convector','Konvektoren'],['floor','Fußbodenheizung']],
  'hc.controlmode': [['weather compensated','Außentemperaturgeführt'],['outside basepoint','Außentemp. mit Fußpunkt'],['n/a','–'],['room','Raumgeführt'],['power','Leistung'],['constant','Konstant']],
  'hc.program':     [['prog 1','Programm 1'],['prog 2','Programm 2']],
  'hc.nofrostmode': [['room','Raum'],['outdoor','Außen'],['room outdoor','Raum & Außen']],
  'hc.reducemode':  [['outdoor','Außenhalt'],['room','Raumhalt'],['reduce','Reduziert']],
  'hc.hpmode':      [['heating','Heizen'],['cooling','Kühlen'],['heating & cooling','Heizen und Kühlen']],
  'hc.control':     [['off','Keine'],['-','–'],['RC100','CR10 / RC100'],['RC100H','CR10H / RC100H'],['-','–'],['RC120RF','CR20RF / RC120RF'],['RC220','RC220 / RT800'],['single','Einzelraumregelung']],
  'hc.switchprogmode':[['level','Level'],['absolute','Absolut']],
  'hc.heatingpid':  [['fast','Schnell'],['medium','Mittel'],['slow','Langsam']],
  'dhw.mode':       [['off','Aus'],['eco+','Eco+'],['eco','Eco'],['comfort','Komfort'],['auto','Auto']],
  'dhw.modetype':   [['off','Aus'],['eco','Eco'],['comfort','Komfort'],['eco+','Eco+']],
  'dhw.circmode':   [['off','Aus'],['on','Ein'],['auto','Nach WW-Zeitprogramm'],['own prog','Eigenes Programm']],
  'dhw.disinfectday':[['mo','Montag'],['tu','Dienstag'],['we','Mittwoch'],['th','Donnerstag'],['fr','Freitag'],['sa','Samstag'],['su','Sonntag'],['all','Täglich']],
  'b.circmode':     [['off','Aus'],['1x3min','1 × 3 min/h'],['2x3min','2 × 3 min/h'],['3x3min','3 × 3 min/h'],['4x3min','4 × 3 min/h'],['5x3min','5 × 3 min/h'],['6x3min','6 × 3 min/h'],['continuous','Dauerbetrieb']],
  'building':       [['light','Leicht'],['medium','Mittel'],['heavy','Schwer']],
  'silentmode':     [['off','Aus'],['auto','Auto'],['on','Dauerhaft an']],
  'auxheatersource':[['not installed','Nicht installiert'],['electric heater','Elektrischer Zuheizer'],['exclusive','Bivalent-alternativ'],['parallel','Bivalent-parallel'],['hybrid','Hybrid']],
  'auxheatrmode':   [['eco','Eco'],['comfort','Komfort']],
  'maxheatcomp':    [['0 kW','0 kW'],['3 kW','3 kW'],['6 kW','6 kW'],['9 kW','9 kW']],
  'maxheat':        [['3 kW','3 kW'],['6 kW','6 kW'],['9 kW','9 kW']],
  'hppumpmode':     [['auto','Auto'],['continuous','Dauerbetrieb']],
  'hpactivity':     [['off','Aus'],['heating','Heizen'],['cooling','Kühlen'],['hot water','Warmwasser'],['pool','Pool'],['pool heating','Pool heizen'],['defrost','Abtauen'],['compressor alarm','Kompressor-Alarm']],
  'floordry':       [['off','Aus'],['start','Start'],['heat','Aufheizen'],['hold','Halten'],['cool','Abkühlen'],['end','Ende']],
  'hpoperatingstate':[['heating','Heizen'],['off','Aus'],['cooling','Kühlen']],
  'summermode':     [['winter','Winter'],['summer','Sommer']],
  'modetype':       [['eco','Absenken'],['comfort','Heizen']],
};
// Übersetzung für Anzeige reiner Sensoren (Text → deutsch), auch wenn EMS-ESP englisch sendet
function trEnum(enumKey, raw){
  const list = ENUM[enumKey]; if(!list||raw==null) return raw;
  const r = String(raw).toLowerCase();
  const hit = list.find(o=>o[0].toLowerCase()===r || o[1].toLowerCase()===r);
  return hit?hit[1]:raw;
}

/* =====================================================================
   4) DATENSCHICHT (Home Assistant / Demo)
   ===================================================================== */
const S = {};                    // entity_id → {state, attributes}
let conn = { type:'none', ready:false, send:null };
const resolved = {};             // Standard-ID → tatsächliche ID (oder null)
const SEEN_ENT = new Set();      // Entitäten, die das Panel angezeigt/gelesen hat – nur deren Änderungen lösen ein Neuzeichnen aus
// Seiten, die beliebige HA-Entitäten auflisten (Zuordnung) – dort jede Änderung neu zeichnen
const LIST_PAGES = ['map','mapgrp'];

// UI800 (HMI 800) mit EMS-ESP 3.8.x: diese Werte gibt es nur für das ganze Gerät
// (thermostat_summertemp …), nicht je Heizkreis – EMS-ESP 3.9 liefert sie je nach Regler pro HK (#3257)
const UI800_GLOBAL = ['hpoperatingmode','summertemp','instantstart','coolstart','heatondelay','heatoffdelay','coolondelay','cooloffdelay'];
function R(id){ const r = R0(id); SEEN_ENT.add(r); return r; }
function R0(id){                 // Entität auflösen
  const m = /^(\w+)\.thermostat_hc\d+_(\w+)$/.exec(id);
  // UI800-Werte: gibt es die anlagenweite Entität, ist sie die gültige – die HK-Entität steht bei
  // EMS-ESP 3.8.x dann oft auf 0 (z. B. hc1_summertemp 0, summertemp 21; Forum 11.10.2026)
  if(m && UI800_GLOBAL.includes(m[2]) && !userMap[id]){ const g = R1(m[1]+'.thermostat_'+m[2]); if(S[g] && S[g].state!=='unavailable') { resolved[id]=g; return g; } }
  const r0 = R1(id);
  if(S[r0]) return r0;
  // CS5800i/UI800 mit EMS-ESP 3.8.x: kein „hpoperatingstate“ – Betriebsart der WP (hpactivity) zeigt den Zustand
  if(m && m[2]==='hpoperatingstate'){ const g = R1('sensor.boiler_hpactivity'); if(S[g]) { resolved[id]=g; return g; } }
  return r0;
}
function R1(id){
  if(userMap[id]) return userMap[id];
  if(id in resolved && resolved[id] && S[resolved[id]]) return resolved[id];
  if(S[id]) { resolved[id]=id; return id; }
  // vom Manager über die EMS-ESP unique_id gefunden (Kurz-/Langnamen, Präfix, umbenannte Entitäten)
  if(autoMap[id] && S[autoMap[id]]) { resolved[id]=autoMap[id]; return autoMap[id]; }
  const [dom,obj] = id.split('.');
  // beschreibbare Texte (z. B. Datum/Uhrzeit des Reglers) legt EMS-ESP als text.* an, nicht als sensor.*
  if(dom==='sensor'){ const alt='text.'+obj; const ra = S[alt] ? alt : (autoMap[alt] && S[autoMap[alt]] ? autoMap[alt] : null); if(ra){ resolved[id]=ra; return ra; } }
  // Fallback: gleiche Domain, object_id endet auf die Standard-object_id (z.B. Präfix "ems_esp_")
  let cand = Object.keys(S).find(e=>e.startsWith(dom+'.') && e.endsWith('_'+obj));
  // Anzeige-Werte, die EMS-ESP als beschreibbar anlegt (z. B. boiler_selflowtemp → number.*)
  if(!cand && (dom==='sensor'||dom==='binary_sensor')){
    for(const d of ['number','select','switch','text','sensor','binary_sensor']){ if(d===dom) continue;
      const alt=d+'.'+obj; if(S[alt]){ cand=alt; break; } if(autoMap[alt] && S[autoMap[alt]]){ cand=autoMap[alt]; break; } }
  }
  resolved[id] = cand||null;
  return cand||id;
}
// liefert EMS-ESP diesen Wert überhaupt? true/false, null = unbekannt
function emsKnows(id){
  if(!emsIds) return null;
  const obj=(id.split('.')[1]||'');
  if(!/^(boiler|thermostat|mixer|solar|heatpump|water)_/.test(obj)) return null;
  if(emsIds.has(obj)) return true;
  const m=/^thermostat_hc\d+_(\w+)$/.exec(obj);
  if(m && UI800_GLOBAL.includes(m[1]) && emsIds.has('thermostat_'+m[1])) return true;
  return false;
}
function mapState(id){ return has(id) ? 'ok' : (emsKnows(id)===false ? 'na' : 'miss'); }
function has(id){ const r=R(id); return !!S[r] && S[r].state!=='unavailable'; }
function st(id){ const e=S[R(id)]; return e?e.state:null; }
function at(id,a){ const e=S[R(id)]; return e&&e.attributes?e.attributes[a]:undefined; }
function nv(id){ const v=parseFloat(st(id)); return isNaN(v)?null:v; }
function unit(id){ return at(id,'unit_of_measurement')||''; }
function on(id){ const s=st(id); return s==='on'||s==='true'||s==='1'; }

// Select-Option über Index auf deutsche Anzeige
// EMS-ESP 3.9-dev liefert „hpoperatingmode“ des UI800 mit Sommer/Auto/Winter statt Aus/Auto/Heizen/Kühlen
function enumOf(id, enumKey){
  if(enumKey==='hc.hpoperatingmode'){ const o=at(id,'options')||[]; if(o.length===3) return ENUM['hc.summersetmode']; }
  return ENUM[enumKey];
}
function selLabel(id, enumKey){
  const s = st(id); if(s==null) return '–';
  const opts = at(id,'options'); const list = enumOf(id, enumKey);
  if(list && opts){ const i = opts.indexOf(s); if(i>=0 && list[i]) return list[i][1]; }
  return trEnum(enumKey,s);
}
function selIndex(id){ const opts=at(id,'options')||[]; return opts.indexOf(st(id)); }
function selEnKey(id, enumKey){ const i=selIndex(id); const l=enumOf(id, enumKey); if(i>=0&&l&&l[i]) return l[i][0]; return String(st(id)||'').toLowerCase(); }

function callService(domain, service, data){
  if(conn.type==='demo'){ demoApply(domain,service,data); return Promise.resolve(); }
  if(!conn.ready){ toast('Keine Verbindung zu Home Assistant'); return Promise.reject(); }
  return conn.call(domain,service,data).catch(e=>{ toast('Fehler: '+(e&&e.message||e)); throw e; });
}
function setNumber(id,v){ return callService('number','set_value',{entity_id:R(id),value:v}); }
function setSelectIdx(id,i){ const opts=at(id,'options')||[]; if(opts[i]==null) return; return callService('select','select_option',{entity_id:R(id),option:opts[i]}); }
function setSwitch(id,v){ const d=R(id).split('.')[0]; return callService(d==='input_boolean'?'input_boolean':'switch', v?'turn_on':'turn_off',{entity_id:R(id)}); }

function onStates(list){ list.forEach(e=>S[e.entity_id]={state:e.state,attributes:e.attributes||{}}); for(const k in resolved) delete resolved[k]; scheduleRender(); }
function onChange(e){
  if(!e) return;
  const id=e.entity_id, had=id in S;
  if(e.new_state) S[id]={state:e.new_state.state,attributes:e.new_state.attributes||{}}; else delete S[id];
  const added=!had||!e.new_state;   // Entität neu oder entfernt → Zuordnung neu prüfen
  if(added && !resolved[id]) for(const k in resolved) if(resolved[k]==null) delete resolved[k];
  // Änderungen anderer HA-Entitäten (Bus-Log, Lichter, Sensoren …) zeichnen das Panel nicht neu –
  // spart auf Wandtablets viel Rechenzeit (vorher bis zu 4× pro Sekunde komplett neu)
  if(!added && !SEEN_ENT.has(id) && !LIST_PAGES.includes((top_()||{}).type)) return;
  scheduleRender();
}

async function connect(){
  // a) im HA-Iframe → Verbindung des Frontends mitbenutzen
  if(settings.mode!=='demo' && settings.mode!=='token'){
    try{
      const ha = window.parent && window.parent!==window && window.parent.document.querySelector('home-assistant');
      const hass = ha && ha.hass;
      if(hass && hass.connection){
        const c = hass.connection;
        conn = { type:'hass', ready:true, msg:m=>c.sendMessagePromise(m), call:(d,s,data)=>c.sendMessagePromise({type:'call_service',domain:d,service:s,service_data:data}) };
        onStates(Object.values(hass.states));
        // Abo der HA-Verbindung beim Schließen/Neuladen des Panels wieder abmelden –
        // sonst bleibt es in der HA-Oberfläche bis zum nächsten Browser-Neuladen bestehen
        const unsubP = c.subscribeEvents(ev=>onChange(ev.data),'state_changed');
        window.addEventListener('pagehide',()=>{ Promise.resolve(unsubP).then(u=>{ if(typeof u==='function') u(); }).catch(()=>{}); },{once:true});
        await loadMgr();
        return;
      }
    }catch(e){ /* anderer Origin */ }
  }
  // b) eigener WebSocket mit Token (Token aus Datei-Kopf hat Vorrang)
  if(MGR && MGR.kiosk_error) toast(MGR.kiosk_error, 6000);
  const token = HA_TOKEN || (MGR && MGR.token) || settings.token;
  if(settings.mode!=='demo' && token){
    let base = HA_URL || settings.url || location.origin;
    if(!/^https?:/.test(base)) base = 'http://homeassistant.local:8123';
    const url = base.replace(/^http/,'ws').replace(/\/$/,'')+'/api/websocket';
    try{ await wsConnect(url, token); await loadMgr(); return; }catch(e){ toast('WebSocket: '+e); }
  }
  // c) Demo
  startDemo();
}
function wsConnect(url, token){
  return new Promise((res,rej)=>{
    let id=1; const pend={}; const ws=new WebSocket(url);
    const send = m => new Promise((ok,ko)=>{ m.id=++id; pend[m.id]={ok,ko}; ws.send(JSON.stringify(m)); });
    ws.onmessage = async ev=>{
      const m=JSON.parse(ev.data);
      if(m.type==='auth_required') ws.send(JSON.stringify({type:'auth',access_token:token}));
      else if(m.type==='auth_invalid'){ rej('Token ungültig'); ws.close(); }
      else if(m.type==='auth_ok'){
        conn = { type:'ws', ready:true, msg:m=>send(m), call:(d,s,data)=>send({type:'call_service',domain:d,service:s,service_data:data}) };
        const r = await send({type:'get_states'}); onStates(r);
        ws.send(JSON.stringify({id:++id,type:'subscribe_events',event_type:'state_changed'}));
        res();
      }
      else if(m.type==='event' && m.event && m.event.data) onChange(m.event.data);
      else if(m.type==='result' && pend[m.id]){ m.success?pend[m.id].ok(m.result):pend[m.id].ko(m.error); delete pend[m.id]; }
    };
    ws.onerror = ()=>rej('Verbindung fehlgeschlagen');
    ws.onclose = ()=>{ if(conn.type==='ws'){ conn.ready=false; toast('Verbindung getrennt – neuer Versuch …'); setTimeout(connect,5000);} };
  });
}


// Verlauf (für Außentemperatur-Grafik): Liste [{t:ms, v:Zahl}]
async function fetchHistory(id, hours){
  const start = new Date(Date.now()-hours*3600e3).toISOString();
  if(conn.type==='demo' && /dhw/.test(id)){ const out=[]; const now=Date.now(); const soll=/settemp/.test(id); for(let t=now-hours*3600e3; t<=now; t+=600e3){ const h=new Date(t).getHours()+new Date(t).getMinutes()/60; out.push({t, v: soll ? (h>=12&&h<14?60:48) : 44+((h*60)%240)/240*8 + (h>=12&&h<14?(h-12)*7:0)}); } return out; }
  if(conn.type==='demo'){ const out=[]; const now=Date.now(); for(let t=now-hours*3600e3; t<=now; t+=900e3){ const h=new Date(t).getHours()+new Date(t).getMinutes()/60; out.push({t, v: 4+5*Math.max(0,Math.sin((h-7)/24*2*Math.PI))+Math.sin(t/2.7e6)*0.6}); } return out; }
  if(!conn.msg) return [];
  try{
    const r = await conn.msg({type:'history/history_during_period', start_time:start, entity_ids:[R(id)], minimal_response:true, no_attributes:true, significant_changes_only:false});
    const arr = (r && (r[R(id)]||Object.values(r)[0])) || [];
    return arr.map(x=>{ const ts = x.lu!=null ? x.lu*1000 : (x.last_updated_ts!=null ? x.last_updated_ts*1000 : Date.parse(x.last_changed||x.last_updated));
      return {t:ts, v:parseFloat(x.s!=null?x.s:x.state)}; }).filter(p=>!isNaN(p.v)&&!isNaN(p.t));
  }catch(e){ return []; }
}

function startDemo(){
  conn = { type:'demo', ready:true };
  const list = [];
  USED.forEach((m,id)=>{
    if(/_hc[234]_/.test(id)) return;
    const dom = id.split('.')[0]; let state='unknown', attributes={};
    if(dom==='number'){ const d=DEMO_NUM[id]||[20,0,90,1,'°C']; state=String(d[0]); attributes={min:d[1],max:d[2],step:d[3],unit_of_measurement:d[4]}; }
    else if(dom==='select'){ const en=ENUM[m.en]||[]; attributes={options:en.map(o=>o[0])}; state=(en[DEMO_SEL[id]||0]||[''])[0]; }
    else if(dom==='switch'||dom==='binary_sensor'){ state = DEMO_ON.includes(id)||DEMO[id]==='on'?'on':'off'; }
    else { state = id in DEMO ? String(DEMO[id]) : (m.kind==='bin'?'off':'unknown');
      if(typeof DEMO[id]==='number'){ attributes.unit_of_measurement = /temp|hptc|hptr|hptl|hppl|hpph|hpta|curtemp|settemp|outdoortemp|rettemp|flowtemp/.test(id)?'°C':/spd|pumpmod|level|valve|circspd/.test(id)?'%':/currpower/.test(id)?'W':/hppower/.test(id)?'kW':/syspress/.test(id)?'bar':/flow$/.test(id)?'l/h':/uptime|workm/.test(id)?'min':/nrg|meter/.test(id)?'kWh':''; }
    }
    list.push({entity_id:id,state,attributes});
  });
  onStates(list);
  // leichte Bewegung der Messwerte
  setInterval(()=>{
    const j=(id,a)=>{ if(S[id]){ S[id].state=String((parseFloat(S[id].state)+(Math.random()-.5)*a).toFixed(1)); } };
    j('sensor.boiler_curflowtemp',.3); j('sensor.boiler_rettemp',.3); j('sensor.boiler_outdoortemp',.1); j('sensor.boiler_dhw_curtemp',.1); j('sensor.boiler_hpcurrpower',20);
    S['sensor.thermostat_datetime'].state = new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    scheduleRender();
  },4000);
  S['sensor.thermostat_datetime'].state = new Date().toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function demoApply(domain,service,data){
  const e=S[data.entity_id]; if(!e) return;
  if(domain==='number') e.state=String(data.value);
  else if(domain==='select') e.state=data.option;
  else if(service==='turn_on') e.state='on'; else if(service==='turn_off') e.state='off';
  if(data.entity_id==='select.thermostat_dhw_mode'){ const i=e.attributes.options.indexOf(data.option); if(i>=1&&i<=3) S['sensor.thermostat_dhw_modetype'].state=['','eco+','eco','comfort'][i]; }
  toast('Demo: '+data.entity_id+' → '+(data.value??data.option??service),1800);
  scheduleRender();
}

function mxEq(e, hs){

  if(typeof e.i==='number'){ const o=(hs.attributes||{}).options; if(Array.isArray(o) && o.includes(hs.state)) return o.indexOf(hs.state)===e.i; }

function mxSame(a,b){ if(a==null||b==null) return false;
  const B=x=>{ x=String(x).trim().toLowerCase(); return ['true','on','1','an','ein','aan','på','wł','zap','áno','ano','açık','acceso','be'].includes(x)?'on':['false','off','0','aus','uit','av','wył','vyp','nie','kapalı','spento','ki'].includes(x)?'off':x; };
  const fa=parseFloat(a), fb=parseFloat(b);
  if(!isNaN(fa)&&!isNaN(fb)&&/^-?[\d.]+$/.test(String(a).trim())&&/^-?[\d.]+$/.test(String(b).trim())) return Math.abs(fa-fb)<0.051;
  return B(a)===B(b); }

let DOPT = null;      // {config, state} vom Manager

async function doptSave(patch){
  if(!conn.msg){ toast('Nur in Home Assistant möglich'); return; }
  if(MGR && MGR.is_admin===false){ toast('Ändern nur als Administrator'); return; }
  const cfg = Object.assign({}, doptCfg(), patch);
  // echte Entitäten nach Zuordnung / Entity-ID-Format
  cfg.mode_entity = R('select.thermostat_dhw_mode');
  cfg.stop_entity = R('number.boiler_dhw_comfstop');
  cfg.temp_entity = R('sensor.boiler_dhw_curtemp');
  const opts = at('select.thermostat_dhw_mode','options')||[], ci = (ENUM['dhw.mode']||[]).findIndex(x=>x[0]==='comfort');
  cfg.comfort_option = opts[ci] || cfg.comfort_option || '';
  try{ DOPT = await conn.msg({type:'ems_esp_manager/panel/dhwopt', config:cfg}); }
  catch(e){ toast('Nicht gespeichert: '+((e&&e.message)||e)); }
  render();
}
async function doptRun(){ if(!conn.msg) return; try{ DOPT = await conn.msg({type:'ems_esp_manager/panel/dhwopt', run:true}); }catch(e){} render(); }

function doptPick(title,key,filter,none){

function doptName(e){ return e ? (((S[e]||{}).attributes||{}).friendly_name || e) : '–'; }

/* ---------- Werte einstellen: Bosch-Rolle (Wert wird beim Verlassen übernommen) ---------- */
function numMeta(id,it){
  let min=+at(id,'min'), max=+at(id,'max'), step=+at(id,'step');
  if(isNaN(min)) min=0; if(isNaN(max)||max<=min) max=min+100; if(!step||isNaN(step)) step=1;
  if(it && it.fmt==='time' && step<15) step=15;
  let u=unit(id); if(u==='C') u='°C';
  return {min,max,step,u};
}
const r3 = x => Math.round(x*1000)/1000;
function rollHtml(t, fmt, unitTxt){
  const p = t.v+t.step<=t.max+1e-9 ? fmt(r3(t.v+t.step)) : '', n = t.v-t.step>=t.min-1e-9 ? fmt(r3(t.v-t.step)) : '';   // oben = höher
  return `<div class="vroll"><div class="col" id="roll"><div class="v p">${p}</div><div class="v c">${fmt(t.v)}</div><div class="v n">${n}</div>
      <div class="unit">${esc(unitTxt||'')}</div></div>
    <div class="ud"><div data-a="${a(()=>stepRoll(t,1))}">${ico(I.up,30)}</div><div data-a="${a(()=>stepRoll(t,-1))}">${ico(I.down,30)}</div></div></div>`;
}
function stepRoll(t,d){ t.v = r3(Math.min(t.max,Math.max(t.min,t.v+d*t.step))); render(); }
function bindRoll(t){
  const col=$('#roll'); if(!col) return; let y0=null, v0=0;
  col.addEventListener('pointerdown',e=>{ y0=e.clientY; v0=t.v; t.dragging=true; col.setPointerCapture(e.pointerId); });
  col.addEventListener('pointermove',e=>{ if(y0==null) return; const s=parseFloat(getComputedStyle($('#dev')).transform.split(',')[3])||1;
    const steps=Math.round((y0-e.clientY)/s/40); const nvv=r3(Math.min(t.max,Math.max(t.min,v0+steps*t.step)));
    if(nvv!==t.v){ t.v=nvv; const c=col.querySelector('.v.c'),p=col.querySelector('.v.p'),n=col.querySelector('.v.n');
      c.textContent=t.fmt(t.v); p.textContent=t.v+t.step<=t.max+1e-9?t.fmt(r3(t.v+t.step)):''; n.textContent=t.v-t.step>=t.min-1e-9?t.fmt(r3(t.v-t.step)):''; } });
  const end=()=>{ if(y0==null) return; y0=null; t.dragging=false; };
  col.addEventListener('pointerup',end); col.addEventListener('pointercancel',end);
  col.addEventListener('wheel',e=>{ e.preventDefault(); stepRoll(t, e.deltaY<0?1:-1); },{passive:false});
}
function vEdit(t){

/* ---------- Heizen (Bosch: Tabs + waagerechte Rolle) ---------- */
let hcTimer=null;
function hRoll(items, idx, onPick){
  // items: [{html,val}] – idx = Mitte
  let pos=PORTRAIT ? [[-1,-132,48,.55],[0,0,100,1],[1,132,48,.55]] : [[-2,-250,46,.25],[-1,-150,64,.7],[0,0,124,1],[1,150,64,.7],[2,250,46,.25]];
  // Abstand nach geschätzter Textbreite (Texte wie „Komfort“ sind breiter als Zahlen) – nie enger als die Standardposition
  const isText = items.some(it=>/[A-Za-zÄÖÜäöü]{3}/.test(String(it.html).replace(/<[^>]*>/g,'')));
  if(isText) pos = PORTRAIT ? [[-1,-132,36,.55],[0,0,80,1],[1,132,36,.55]] : [[-2,-250,34,.25],[-1,-150,50,.7],[0,0,100,1],[1,150,50,.7],[2,250,34,.25]];
  const w = (k,fs) => String(items[k].html).replace(/<[^>]*>/g,'').length*fs*0.56;
  const xs = {}; xs[0]=0;
  pos.slice().sort((p,q)=>Math.abs(p[0])-Math.abs(q[0])).forEach(([o,x,fs])=>{
    if(!o) return; const k=idx+o, prevO=o-Math.sign(o), pk=idx+prevO;
    if(k<0||k>=items.length||pk<0||pk>=items.length){ xs[o]=x; return; }
    const pfs=(pos.find(p=>p[0]===prevO)||[0,0,fs])[2];
    const need=(xs[prevO]||0)+Math.sign(o)*(w(pk,pfs)/2+w(k,fs)/2+28);
    xs[o]= o>0?Math.max(x,need):Math.min(x,need); });
  const its = pos.map(([o,x0,fs,op])=>{ const k=idx+o; if(k<0||k>=items.length) return ''; const x=xs[o]!=null?xs[o]:x0;
    return `<div class="it" style="left:calc(50% + ${x}px);transform:translateX(-50%);font-size:${fs}px;opacity:${op}" ${o?`data-a="${a(()=>onPick(k))}"`:''}>${items[k].html}</div>`; }).join('');
  return `<div class="hroll">${its}
    <div class="navl ${idx<=0?'off':''}" data-a="${a(()=>{ if(idx>0) onPick(idx-1); })}">${ico(I.arrL,22)}</div>
    <div class="navr ${idx>=items.length-1?'off':''}" data-a="${a(()=>{ if(idx<items.length-1) onPick(idx+1); })}">${ico(I.arrR,22)}</div></div>`;
}
function vHC(n){

  if(t.pend==null || !hcTimer) t.pend = nv(sId);
  const tab=(i,l)=>`<span class="${mi===i?'on':''}" data-a="${a(()=>setSelectIdx(mId,i))}">${l}</span>`;
  let mid='';
  if(mi===0) mid=`<div class="hroll"><div class="it" style="left:50%;transform:translateX(-50%);font-size:110px">Aus</div></div>`;

    let idx=vals.findIndex(v=>Math.abs(v-t.pend)<step/2); if(idx<0) idx=0;

/* ---------- Zeitprogramm (Schaltzeiten) – über den EMS-ESP Manager ----------
   Telegramm 0x02C3 (HK1): 7 Tage × 6 Schaltpunkte [Modus, Zeit/15 min], 03 = Heizen, 01 = Absenken
   Telegramm 0x02FF (Warmwasser): gleicher Aufbau, Modus = Warmwasser-Stufe 00 Aus, 01 Eco+, 02 Eco, 03 Komfort */
const SCHED = {};
/* Aktuelles Niveau Heizkreis: EMS-ESP liest beim UI800 das Niveau-Bit aus RC300Monitor(0x02A5) falsch
   (zeigt „Absenken“, obwohl laut Zeitprogramm geheizt wird – Log 18.10.2026). Darum: im Auto-Betrieb aus dem
   gelesenen Zeitprogramm bestimmen, sonst über die aktuelle Wunschtemperatur (Heizen- oder Absenktemperatur). */
function hcLevel(n){
  const md=selEnKey('select.'+hcX(n,'mode'),'hc.mode');
  if(md==='manual') return 'Manuell'; if(md==='off') return 'Aus';
  const c=SCHED[n];
  if(c && c.days){
    const now=new Date(), di=(now.getDay()+6)%7, mins=now.getHours()*60+now.getMinutes();
    const tm=s_=>{ const [h,m]=s_.split(':').map(Number); return h*60+m; };
    for(let k=0;k<8;k++){
      const d=(di-k+7)%7, pts=(c.days[d]||[]).slice().sort((a,b)=>tm(a.time)-tm(b.time));
      const cand = k===0 ? pts.filter(p=>tm(p.time)<=mins) : pts;
      if(cand.length) return cand[cand.length-1].mode==='heat'?'Heizen':'Absenken';
      if(!pts.length && (c.constant||[])[d]) return c.constant[d]==='heat'?'Heizen':'Absenken';
      if(k===0 && pts.length) continue;
    }
  }
  const sel=nv('number.'+hcX(n,'seltemp')), ct=nv('number.'+hcX(n,'comforttemp')), et=nv('number.'+hcX(n,'ecotemp'));
  if(sel!=null && ct!=null && et!=null && ct!==et) return Math.abs(sel-ct)<=Math.abs(sel-et)?'Heizen':'Absenken';
  return trEnum('modetype',st('sensor.'+hcX(n,'modetype')));
}                 // hc (1..4) oder 'dhw' → {days:[[{time,mode}]], at, loading, err}
// Stufen je Programm: m = Modus (wie vom Manager), i = Symbol, o = Deckkraft im Tagesbalken (0 = leer)
const SPROG = n => n==='dhw'

     def:[{time:'05:00',mode:'comfort'},{time:'23:00',mode:'off'}]}

     modes:[{m:'heat',l:'Heizen',i:'☀',o:1},{m:'eco',l:'Absenken',i:'☾',o:0}],

  if(!MGR || !conn.msg){ c.err='Nur mit dem EMS-ESP Manager verfügbar'; render(); return; }
  c.loading=true; c.err=null; scheduleRender();
  try{ const r = await conn.msg(Object.assign({type:'ems_esp_manager/schedule/get', force:!!force}, schedMsg(n))); c.days=r.days; c.constant=r.constant||[]; c.complete=r.complete; c.updated=r.updated; c.note=r.note; c.at=Date.now(); }

    if(!sorted.length){ toast('Mindestens ein Schaltpunkt'); return; }

    <div class="btns"><div class="btn" data-a="${a(pop)}">Abbrechen</div><div class="btn pri" data-a="${a(save)}">Speichern</div></div>`;
}

const ETODAY = {at:0, day:'', v:{}, loading:false, err:null};
async function loadEnergyToday(force){
  const keys=['nrgconscomptotal','auxelecheatnrgconstotal','nrgsupptotal'];
  const day=new Date().toDateString();
  if(ETODAY.loading || (!force && ETODAY.day===day && Date.now()-ETODAY.at<300e3)) return;
  ETODAY.loading=true;
  const mid=new Date(); mid.setHours(0,0,0,0);
  const hours=(Date.now()-mid.getTime())/3600e3;
  const v={}; let miss=0;
  for(const k of keys){
    const id=B(k); if(!has(id)){ v[k]=0; continue; }
    if(conn.type==='demo'){ v[k]={nrgconscomptotal:6,auxelecheatnrgconstotal:0,nrgsupptotal:25}[k]*Math.max(.1,hours/24); continue; }
    const h=await fetchHistory(id, hours);
    const first=h[0], cur=nv(id);
    if(first==null||cur==null){ v[k]=null; miss++; continue; }
    v[k]=Math.max(0,cur-first.v);
  }
  Object.assign(ETODAY,{v, day, at:Date.now(), loading:false, err: miss?'Kein Verlauf seit 0:00 – Entität wird im Recorder nicht aufgezeichnet?':null});
  scheduleRender();
}

/* ---------- Heizkurve ---------- */
function vCurve(n){
  const p = k=>nv('number.'+hcX(n,k));
  const design=p('designtemp')??40, maxF=p('maxflowtemp')??55, minF=p('minflowtemp')??20, off=p('offsettemp')??0;
  const room = p('seltemp')??20, minExt = nv('number.thermostat_minexttemp')??-12;
  const floor = selEnKey('select.'+hcX(n,'heatingtype'),'hc.heatingtype')==='floor'; const ex = floor?1/1.1:1/1.3;
  const f = to=>{ if(to>=room) return Math.max(minF,room); const r=Math.pow((room-to)/(room-minExt),ex); return Math.min(maxF,Math.max(minF, room+(design-room)*r + off + (room-20)*1.5)); };
  const ot=nv('sensor.boiler_outdoortemp'), tf=nv('sensor.'+hcX(n,'targetflowtemp'));
  const istV = nv(n>1 && has('sensor.mixer_hc'+n+'_flowtemphc') ? 'sensor.mixer_hc'+n+'_flowtemphc' : 'sensor.boiler_curflowtemp');
  // Y-Bereich an Kurve, Min/Max und Ist/Soll anpassen (statt fest 15–60 °C)
  const vals=[minF,maxF,f(20),f(-25)]; if(istV!=null) vals.push(istV); if(tf!=null) vals.push(tf);
  let lo=Math.floor((Math.min(...vals)-4)/5)*5, hi=Math.ceil((Math.max(...vals)+4)/5)*5; if(hi-lo<20){ const c=(hi+lo)/2; lo=Math.floor((c-10)/5)*5; hi=lo+20; }
  const stepY = hi-lo>40 ? 10 : 5;
  const W=PORTRAIT?378:660,H=PORTRAIT?250:240,x0=PORTRAIT?36:50,y0=28; const X=to=>x0+(20-to)/45*(W-x0-10); const Y=v=>y0+(1-(v-lo)/(hi-lo))*(H-y0-30);
  let d=''; for(let to=20;to>=-25;to-=0.5) d+=(d?'L':'M')+X(to).toFixed(1)+' '+Y(f(to)).toFixed(1);
  const grid=[]; for(let to=20;to>=-25;to-=(PORTRAIT?10:5)) grid.push(`<line x1="${X(to)}" x2="${X(to)}" y1="${y0}" y2="${H-30}" stroke="#222"/><text x="${X(to)}" y="${H-12}" fill="#888" font-size="12" text-anchor="middle">${to}°</text>`);
  for(let v=lo;v<=hi;v+=stepY) grid.push(`<line x1="${x0}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#222"/><text x="${x0-8}" y="${Y(v)+4}" fill="#888" font-size="12" text-anchor="end">${v}°</text>`);
  const lblDy = (istV!=null && tf!=null && Math.abs(Y(istV)-Y(tf))<20 && Y(tf)>=Y(istV)) ? 22 : -8;   // Soll-Text nicht auf die Ist-Linie legen
  // Soll: senkrechte blau gestrichelte Linie bei der aktuellen Außentemperatur, Beschriftung mit dem Vorlauf-Soll
  const xo = ot!=null ? X(Math.max(-25,Math.min(20,ot))) : null;
  const pt = xo!=null&&tf!=null?`<line x1="${xo}" x2="${xo}" y1="${y0}" y2="${H-30}" stroke="#4fb3f6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${xo+6}" y="${y0+14}" fill="#4fb3f6" font-size="13">Soll ${fmtN(tf,0)}°</text>`:'';
  // aktuelle Ist-Vorlauftemperatur als grüne gestrichelte Linie
  const ist = nv(n>1 && has('sensor.mixer_hc'+n+'_flowtemphc') ? 'sensor.mixer_hc'+n+'_flowtemphc' : 'sensor.boiler_curflowtemp');
  // Ist-Beschriftung rechts: über der Linie, außer die Kurve liegt dort knapp darüber → dann darunter
  const istLy = ist==null ? 0 : (()=>{ const yi=Y(ist), yc=Y(f(-25)); return (yi-yc>=0 && yi-yc<24 && yi+18<=H-32) ? yi+16 : yi-6; })();
  const istLine = ist!=null ? `<line x1="${x0}" x2="${W-10}" y1="${Y(ist)}" y2="${Y(ist)}" stroke="#5fb34a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="${W-14}" y="${istLy}" fill="#5fb34a" font-size="13" text-anchor="end">Ist ${fmtN(ist,1)}°</text>` : '';
  const it = [N('number.'+hcX(n,'designtemp'),'Auslegungstemperatur'),N('number.thermostat_minexttemp','Min. Außentemperatur'),N('number.'+hcX(n,'offsettemp'),'Raumtemperatur-Offset'),
              N('number.'+hcX(n,'minflowtemp'),'Min. Vorlauftemperatur'),N('number.'+hcX(n,'maxflowtemp'),'Max. Vorlauftemperatur')];
  return header(`Heizkurve HK${n}`,{svc:!!(top_()&&top_().svc)})+`<div class="body"><svg width="${W}" height="${H}" style="display:block;margin:8px auto 0">
      ${grid.join('')}<line x1="${x0}" x2="${x0}" y1="${y0}" y2="${H-30}" stroke="#555"/>
      <line x1="${x0}" x2="${W-10}" y1="${Y(maxF)}" y2="${Y(maxF)}" stroke="#e2001a" stroke-dasharray="4 4"/><line x1="${x0}" x2="${W-10}" y1="${Y(minF)}" y2="${Y(minF)}" stroke="#2a8fd6" stroke-dasharray="4 4"/>
      ${istLine}<path d="${d}" fill="none" stroke="#fff" stroke-width="2.5"/>${pt}
      <text x="${W-10}" y="${y0-10}" fill="#888" font-size="12" text-anchor="end">${floor?'Fußboden':'Heizkörper'}</text></svg>
    <div class="list">${it.map(rowHtml).join('')}</div></div>`;
}

    ${settings.mode==='token'?`<div style="padding:12px 14px"><div style="font-size:15px;color:#aaa;margin-bottom:6px">HA-Adresse (leer = gleiche Adresse)</div><input id="iurl" value="${esc(settings.url)}" placeholder="http://homeassistant.local:8123">
      <div style="font-size:15px;color:#aaa;margin:12px 0 6px">Long-Lived Access Token (HA → Profil → Sicherheit)</div><input id="itok" type="password" value="${esc(settings.token)}"></div>`:''}
    <div class="note">${MGR?`Panel-Version ${esc(PANEL_VERSION)} · ausgeliefert vom EMS-ESP Manager. In Home Assistant wird die Anmeldung von HA genutzt; für den Zugriff von außen den Token im Manager unter „Konfigurieren“ hinterlegen und die Kiosk-Adresse verwenden.`:'„Automatisch“ funktioniert, wenn die Seite als Webseiten-Dashboard in Home Assistant (/local/…) eingebunden ist.'}</div>
  </div></div>
  <div class="btns"><div class="btn pri" data-a="${a(()=>{ const u=$('#iurl'),k=$('#itok'); if(u) settings.url=u.value.trim(); if(k) settings.token=k.value.trim(); saveSettings(); location.reload(); })}">Übernehmen & neu verbinden</div></div>`;
}
function vContact(){

   <div class="row ro"><span class="k">Name</span><span class="v d">${esc(INSTALLER.name||'–')}</span></div>
   <div class="row ro"><span class="k">Adresse</span><span class="v d">${esc(INSTALLER.addr||'–')}</span></div>
   ${INSTALLER.tel?`<div class="row ro"><span class="k">Telefon</span><span class="v d">${esc(INSTALLER.tel)}</span></div>`:''}</div></div>`;

function vPanel(){
  const total=[...USED.keys()].filter(id=>!/_hc[234]_/.test(id)||hcExists(+id.match(/_hc(\d)_/)[1]));
  const found=total.filter(has).length;
  return header('Panel-Einstellungen')+`<div class="body"><div class="list">
    <div class="row" data-a="${a(()=>push({type:'map',filter:'all'}))}"><span class="k">Entitäten-Zuordnung<small>${found} von ${total.length} gefunden</small></span><span class="v">${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>push({type:'map',filter:'miss'}))}"><span class="k">Nur fehlende Entitäten</span><span class="v">${total.length-found}${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>{settings.showMissing=!settings.showMissing;saveSettings();render();})}"><span class="k">Fehlende Entitäten in Menüs anzeigen</span><span class="v"><span class="tog ${settings.showMissing?'on':''}"></span></span></div>
    <div class="row" data-a="${a(()=>push({type:'io'}))}"><span class="k">Zuordnung exportieren / importieren</span><span class="v">${I.chevR}</span></div>
    <div class="row" data-a="${a(()=>{ userMap=Object.assign({},ENTITY_OVERRIDES); saveMap({}); toast('Eigene Zuordnungen gelöscht'); render(); })}"><span class="k">Eigene Zuordnungen zurücksetzen</span><span class="v"></span></div>
  </div></div>`;
}
/* ---------- Entitäten-Zuordnung, gruppiert ---------- */
const MAP_GROUPS = [
  ['heat',  'Heizung'],
  ['dhw',   'Warmwasser'],
  ['hp',    'Wärmepumpe'],
  ['aux',   'Zuheizer'],
  ['pv',    'Photovoltaik'],
  ['energy','Energie & Statistik'],
  ['sys',   'Systemwerte'],
  ['other', 'Sonstiges'],
];
const SYS_IDS = /^(boiler_(reset|outdoortemp|curflowtemp|rettemp|syspress|lastcode|servicecode|servicecodenumber|maintenancemessage)|thermostat_(errorcode|lastcode|datetime|dampedoutdoortemp|absent|building|damping|intoffset|minexttemp|solar|floordry|floordrytemp))$/;
function mapGroup(id){
  const o = id.split('.')[1]||'';
  let m;
  if(/nrg|meter|uptime|starts|hpcurrpower|^boiler_hppower$|maxheat|hpmaxpower|powerlimit|powerreduction/.test(o)) return {g:'energy'};
  if(/(^|_)pv/.test(o)) return {g:'pv'};
  if(/^(boiler|thermostat)_dhw_/.test(o)) return {g:'dhw'};
  if((m=o.match(/^thermostat_hc(\d)_/))) return {g:'heat', hc:+m[1]};
  if(/aux|elheat|emergency|heatcable/.test(o)) return {g:'aux'};
  if(SYS_IDS.test(o)) return {g:'sys'};
  if(/^boiler_/.test(o)) return {g:'hp'};
  return {g:'other'};
}
function mapIds(){ return [...USED.keys()].filter(id=>!/_hc[234]_/.test(id)||hcExists(+id.match(/_hc(\d)_/)[1])); }
// Bezeichnungen für Werte ohne eigenen Menüeintrag bzw. mit mehrdeutigem Menütext
const MAP_LABELS = {
  thermostat_dhw_chargeduration:'Extra-Warmwasser Dauer', thermostat_dhw_charge:'Extra-Warmwasser starten', thermostat_dhw_extra:'Extra-Warmwasser aktiv',
  thermostat_dhw_modetype:'Aktuelles Warmwasser-Niveau', thermostat_dhw_mode:'Betriebsart Warmwasser', boiler_dhw_curtemp:'Warmwassertemperatur',
  thermostat_minexttemp:'Min. Außentemperatur (Auslegung)', boiler_outdoortemp:'Außentemperatur', boiler_curflowtemp:'Vorlauftemperatur',
  boiler_rettemp:'Rücklauftemperatur', boiler_syspress:'Betriebsdruck', thermostat_absent:'Abwesend',
  boiler_hpactivity:'Betriebsart Wärmepumpe', boiler_silentmode:'Geräuscharmer Betrieb', boiler_silentfrom:'Geräuscharm von', boiler_silentto:'Geräuscharm bis',
  thermostat_dhw_circmode:'Zirkulation Betriebsart', boiler_fanspd:'Ventilator Drehzahl', boiler_fan:'Ventilator (Funktionstest)',
  thermostat_dhw_disinfecttime:'Desinfektion Zeit', thermostat_dhw_dailyheattime:'Tägliche Aufheizung Zeit',
  boiler_auxheaterstatus:'Zuheizer Status', boiler_auxheaterlevel:'Zuheizer Leistung', thermostat_floordry:'Estrichtrocknung Status', thermostat_floordrytemp:'Estrichtrocknung Solltemperatur',
  boiler_pumpkickday:'Blockierschutz Tag', boiler_pumpkickhour:'Blockierschutz Uhrzeit', boiler_pumpkickdelay:'Blockierschutz Intervall', boiler_dhw_workm:'Laufzeit Warmwasser',
};
const HC_LABELS = { mode:'Betriebsart', designtemp:'Auslegungstemperatur', offsettemp:'Raumtemperatur-Offset', minflowtemp:'Min. Vorlauftemperatur',
  maxflowtemp:'Max. Vorlauftemperatur', seltemp:'Wunschtemperatur', currtemp:'Raumtemperatur', targetflowtemp:'Berechnete Vorlauftemperatur', remotehum:'Luftfeuchte',
  hpoperatingmode:'Betriebsart Heizkreis', comforttemp:'Heizen (Zeitprogramm)' };
function mapLabel(id){
  const o = id.split('.')[1]||'', u = USED.get(id)||{}, lb = u.label||'';
  if(MAP_LABELS[o]) return MAP_LABELS[o];
  const hc = o.match(/^thermostat_hc\d_(.+)$/); if(hc && HC_LABELS[hc[1]]) return HC_LABELS[hc[1]];
  if(/uptime/.test(o)) return /laufzeit/i.test(lb)?lb:'Laufzeit '+(lb||o);
  if(/starts/.test(o)) return /start/i.test(lb)?lb:'Starts '+(lb||o);
  if(/auxelecheatnrgcons/.test(o)) return 'Stromverbrauch '+(lb||o);
  if(/nrgcons/.test(o)) return 'Stromverbrauch '+(lb||o);
  if(/nrgsupp/.test(o)) return 'Erzeugte Wärme '+(lb||o);
  return lb || o.replace(/^(boiler|thermostat)_/,'');
}
// Gruppen-Schlüssel: Heizkreise einzeln (heat1, heat2 …)
function mapBuckets(){
  const multi = HEATING_CIRCUITS.filter(hcExists).length>1;
  const b = new Map();
  MAP_GROUPS.forEach(([k,name])=>{ if(k==='heat') HEATING_CIRCUITS.filter(hcExists).forEach(n=>b.set('heat'+n,{name: multi?`Heizung – ${hcName(n)}`:'Heizung', ids:[]})); else b.set(k,{name,ids:[]}); });
  mapIds().forEach(id=>{ const r=mapGroup(id); const k = r.g==='heat' ? 'heat'+r.hc : r.g; (b.get(k)||b.get('other')).ids.push(id); });
  for(const [k,v] of b) if(!v.ids.length) b.delete(k);
  return b;
}
function vMap(t){
  const miss = t.filter==='miss';
  const all = mapIds(), found = all.filter(has).length, custom = Object.keys(diffMap()).length;
  const naAll = all.filter(id=>mapState(id)==='na').length, missAll = all.length-found-naAll;
  const rows = [...mapBuckets()].map(([k,v])=>{
    const st_=v.ids.map(mapState), f=st_.filter(x=>x==='ok').length, n=v.ids.length, na=st_.filter(x=>x==='na').length, nm=n-f-na;
    if(miss && !nm && !na) return '';
    const pill = nm ? `<span class="pill no">${nm} fehlt</span>` : na ? `<span class="pill na">${na} n. v.</span>` : '<span class="pill">OK</span>';
    return `<div class="row" data-a="${a(()=>push({type:'mapgrp',g:k,filter:t.filter}))}"><span class="k">${esc(v.name)}<small>${f} von ${n} gefunden${na?` · ${na} liefert die Anlage nicht`:''}</small></span><span class="v">${pill}${I.chevR}</span></div>`;
  }).join('');
  return header(miss?'Fehlende Entitäten':'Entitäten-Zuordnung')+`<div class="body"><div class="list">
    <div class="row ro"><span class="k">Gefunden<small>${custom} eigene Zuordnung${custom===1?'':'en'}${emsIds?` · ${naAll} liefert die Anlage nicht · ${missAll} fehlen in HA`:''}</small></span><span class="v d">${found} von ${all.length}</span></div>
    ${emsIds?'':'<div class="note">Hinweis: Welche Werte EMS-ESP liefert, konnte nicht abgefragt werden – „fehlt“ kann daher auch „liefert die Anlage nicht“ bedeuten.</div>'}
    <div class="row" data-a="${a(()=>{ t.filter=miss?'all':'miss'; render(); })}"><span class="k">Nur fehlende anzeigen</span><span class="v"><span class="tog ${miss?'on':''}"></span></span></div>
    ${rows||'<div class="note">Alle Entitäten gefunden.</div>'}</div></div>`;
}
function vMapGroup(t){
  const v = mapBuckets().get(t.g) || {name:'Zuordnung', ids:[]};
  let ids = v.ids.slice().sort((x,y)=>mapLabel(x).localeCompare(mapLabel(y),'de'));
  if(t.filter==='miss') ids = ids.filter(id=>!has(id));
  const rows = ids.map(id=>{ const r=R(id), ok=has(id), custom=!!userMap[id], ms=mapState(id);
    return `<div class="row" data-a="${a(()=>push({type:'mapedit',id}))}"><span class="k" style="font-size:18px">${esc(mapLabel(id))}<small>${esc(r!==id?r:id)}${r!==id?(custom?' · manuell':' · automatisch'):''}</small></span><span class="v"><span class="pill ${ms==='ok'?'':ms==='na'?'na':'no'}" title="${ms==='na'?'EMS-ESP liefert diesen Wert für diese Anlage nicht':''}">${ms==='ok'?'OK':ms==='na'?'nicht geliefert':'fehlt'}</span>${I.chevR}</span></div>`; }).join('');
  return header(v.name)+`<div class="body"><div class="list">${rows||'<div class="note">Keine fehlenden Entitäten in dieser Gruppe.</div>'}</div></div>`;
}
function vMapEdit(t){
  const dom=t.id.split('.')[0]; const cands=Object.keys(S).filter(e=>e.startsWith(dom+'.')).sort();
  const obj=t.id.split('.')[1].replace(/^(boiler|thermostat)_/,''); const sugg=cands.filter(e=>e.includes(obj.split('_').pop())).slice(0,8);
  return header('Zuordnung')+`<div class="body kbd"><div style="padding:14px 20px">
    <div style="font-size:15px;color:#aaa">Funktion</div><div style="font-size:19px;margin:4px 0 10px">${esc(mapLabel(t.id))} <span style="color:#888;font-size:15px">· ${esc((MAP_GROUPS.find(g=>g[0]===mapGroup(t.id).g)||[,''])[1])}</span></div>
    <div style="font-size:15px;color:#aaa">Standard (EMS-ESP)</div><div style="font-size:19px;margin:4px 0 14px">${esc(t.id)}</div>
    <div style="font-size:15px;color:#aaa;margin-bottom:6px">Deine Entität</div>
    <input id="mapin" list="dl" value="${esc(userMap[t.id]||R(t.id))}"><datalist id="dl">${cands.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    ${sugg.length?`<div style="font-size:15px;color:#aaa;margin:14px 0 6px">Vorschläge</div>${sugg.map(s=>`<div class="row" style="min-height:44px;font-size:16px" data-a="${a(()=>{$('#mapin').value=s;})}">${esc(s)} <span class="v d">${esc((S[s]||{}).state)}</span></div>`).join('')}`:''}
  </div></div>
  <div class="btns"><div class="btn" data-a="${a(()=>{ delete userMap[t.id]; saveMap(diffMap()); pop(); })}">Standard</div><div class="btn" data-a="${a(pop)}">Abbrechen</div>
    <div class="btn pri" data-a="${a(()=>{ const v=$('#mapin').value.trim(); if(v && v!==t.id) userMap[t.id]=v; else delete userMap[t.id]; saveMap(diffMap()); toast(has(t.id)?'Zuordnung OK':'Entität nicht gefunden'); pop(); })}">Speichern</div></div>`;
}
function diffMap(){ const o={}; for(const k in userMap) if(ENTITY_OVERRIDES[k]!==userMap[k]) o[k]=userMap[k]; return o; }
function vIO(t){
  return header('Export / Import')+`<div class="body kbd"><div style="padding:12px 20px">
   <div class="note" style="padding:0 0 8px">${MGR?'Eigene Zuordnungen als JSON. Sie werden im EMS-ESP Manager in Home Assistant gespeichert und bleiben bei neuen Panel-Versionen erhalten.':'Eigene Zuordnungen als JSON. Zum dauerhaften Einbau in ENTITY_OVERRIDES oben in der Datei einfügen.'}</div>
   <textarea id="io" rows="9">${esc(JSON.stringify(diffMap(),null,1))}</textarea></div></div>
   <div class="btns"><div class="btn" data-a="${a(()=>{ const ta=$('#io'); ta.select(); try{navigator.clipboard.writeText(ta.value);}catch(e){} toast('Kopiert'); })}">Kopieren</div>
   <div class="btn pri" data-a="${a(()=>{ try{ const o=JSON.parse($('#io').value); userMap=Object.assign({},ENTITY_OVERRIDES,o); saveMap(o); toast('Importiert'); pop(); }catch(e){ toast('Ungültiges JSON'); } })}">Importieren</div></div>`;
}
function vPin(t){
  const keys=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
  const press=k=>{ if(k==='⌫') t.code=t.code.slice(0,-1); else if(k==='OK'){ if(t.code===SERVICE_PIN){ svcOk=Date.now(); stack.pop(); push({type:'menu',id:t.next}); return; } toast('Falscher Code'); t.code=''; } else if(t.code.length<6) t.code+=k; render(); };
  return header('Service – Code')+`<div style="text-align:center;font-size:40px;letter-spacing:12px;margin:96px 0 14px">${'•'.repeat(t.code.length)||'&nbsp;'}</div>
   <div style="display:grid;grid-template-columns:repeat(3,110px);gap:10px;justify-content:center">${keys.map(k=>`<div class="btn" style="height:66px" data-a="${a(()=>press(k))}">${k}</div>`).join('')}</div>`;
}


/* ---------- Hilfe, Reinigung, Bildschirmschoner ---------- */
const HELP = {
  home:'Kacheln antippen zum Öffnen, mit den Pfeilen oder Wischen blättern. ≡ öffnet das Menü, ≡ 2 Sekunden gedrückt halten öffnet das Servicemenü. Der Haken zeigt Störungen.',
  hc:'Aus / Auto / Manuell wählt die Betriebsart. Wunschtemperatur mit den Pfeilen oder durch Antippen der Nachbarwerte ändern – sie wird nach ca. 1 s an EMS-ESP gesendet.',
  dhwp:'Eco+: beste Wirtschaftlichkeit · Eco: mittlerer Komfort · Komfort: bester Warmwasserkomfort.',
  energy:'Umweltanteil = erzeugte Wärme − Strom Kompressor − Strom Zuheizer (Werte aus EMS-ESP).',
  curve:'Die Kurve wird aus Auslegungstemperatur, min. Außentemperatur und Offset berechnet. Die blau gestrichelte Linie zeigt das aktuelle Vorlauf-Soll der WP, die grün gestrichelte die Ist-Vorlauftemperatur.',
  edit:'Wert mit ˄ / ˅, Mausrad oder Wischen auf der Zahl einstellen. Beim Zurückgehen wird der Wert an die Wärmepumpe gesendet.',
  ov:'Links Außentemperatur (antippen = Verlauf gestern/heute) und Betriebsdruck. Rechts Vor-/Rücklauf der Außeneinheit, Heizkreis und Warmwasser.',
  outdoor:'Verlauf der Außentemperatur aus der Home-Assistant-Historie.',
  refrig:'Kältekreis im Heizbetrieb. „Werte“ zeigt die aktuellen Messwerte aus EMS-ESP, „Bezeichnungen“ die Bosch-Fühler- und Bauteilnamen. Links Außeneinheit mit Verdampfer (TL2 Lufteintritt, PL3 Ventilator), Mitte Zwischenwärmetauscher (JR0 Niederdruck), oben Kompressor (ER1 Drehzahl, TR1 Temperatur), rechts Kondensator (JR1 Hochdruck) mit Heizwasser TC3/TC0 und Pumpe PC0, unten Expansionsventile VR1/VR0. TR9 liefert EMS-ESP nicht (–).',
  dhwhist:'Ist- und Solltemperatur Warmwasser von heute (0–24 Uhr) aus der Home-Assistant-Historie. Orange = Ist, blau gestrichelt = Soll.',
};
function showHelp(){
  const t=top_(); const txt = HELP[t.type] || (t.type==='menu'?`„${(typeof (MENUS[t.id]||{}).title==='function'?MENUS[t.id].title():(MENUS[t.id]||{}).title)}“: Pfeil = Untermenü/Einstellung, Schalter wirken sofort.`:'');
  const o=$('#ovl'); o.style.display='block';
  o.innerHTML=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.7)" data-close="1"></div><div class="pop"><div class="x" data-close="1">×</div>
    <h3>${ico(I.help,26)} Hilfe</h3><div>${esc(txt)}</div>
    <div style="margin-top:18px;font-size:15px;color:#9aa3ad">Verbindung: ${conn.type}${conn.type==='demo'?' (Demo-Daten)':''} · Datenquelle EMS-ESP · Bosch-HMI-800-Nachbau für Home Assistant</div></div>`;
  o.onclick=e=>{ if(e.target.dataset.close){ o.style.display='none'; o.innerHTML=''; } };
}
function cleanMode(){
  const o=$('#ovl'); o.style.display='block'; let n=15;
  const upd=()=>{ o.innerHTML=`<div class="saver" style="z-index:41">${ico(I.hand,80)}<div style="font-size:26px;color:#aaa">Display-Reinigung</div><div class="clk">${n}</div></div>`; };
  upd(); const iv=setInterval(()=>{ n--; if(n<=0){ clearInterval(iv); o.style.display='none'; o.innerHTML=''; } else upd(); },1000);
  o.onclick=null;
}
let idleT=null, saverOn=false;
function resetIdle(){ if(saverOn){ saverOn=false; $('#ovl').style.display='none'; $('#ovl').innerHTML=''; } clearTimeout(idleT); if(settings.saver>0) idleT=setTimeout(showSaver, settings.saver*60000); }
function showSaver(){
  saverOn=true; const o=$('#ovl'); o.style.display='block';
  const upd=()=>{ if(!saverOn) return; o.innerHTML=`<div class="saver"><div class="clk">${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}</div><div style="font-size:24px;display:flex;align-items:center;gap:6px">${I.houseT} ${tempTxt('sensor.boiler_outdoortemp',1)}</div></div>`; setTimeout(upd,20000); };
  upd(); home();
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,resetIdle,true));
function applyDisplay(){ $('#dim').style.opacity = String((100-settings.brightness)/100*0.8); resetIdle(); }

/* ---------- Skalierung ---------- */
let PORTRAIT=false;
function fit(){
  const w=innerWidth, h=innerHeight, dev=$('#dev');
  const p = h > w*1.15;                       // Hochformat → Handy-Layout (iPhone 17: 402 pt breit)
  const changed = p!==PORTRAIT; PORTRAIT=p; document.body.classList.toggle('portrait',p);
  if(p){ const W=402, s=w/W; dev.style.width=W+'px'; dev.style.height=(h/s)+'px'; dev.style.transform=`scale(${s})`; }
  else { const s=Math.min(w/800,h/480); dev.style.width='800px'; dev.style.height='480px'; dev.style.transform=`scale(${s})`; }
  if(changed && typeof render==='function' && stack) render();
}
addEventListener('resize',fit);

/* ---------- Start ---------- */
fit(); applyDisplay(); render(); connect().then(render);
</script>
